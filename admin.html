<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reservas · Admin · MOVE®</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

  <!-- LOGIN -->
  <section class="login-wrap" id="loginView">
    <form class="login-card" id="loginForm">
      <a href="/" class="brand">MOVE<span>®</span></a>
      <p class="login-sub">Panel de reservas</p>
      <label class="field">
        <span>Clave de acceso</span>
        <input type="password" id="keyInput" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn btn-block">Entrar</button>
      <p class="form-msg" id="loginMsg"></p>
    </form>
  </section>

  <!-- PANEL -->
  <div class="admin hidden" id="panelView">
    <header class="admin-nav">
      <div class="admin-nav-left">
        <a href="/" class="brand">MOVE<span>®</span></a>
        <span class="admin-badge">Admin</span>
      </div>
      <div class="admin-nav-right">
        <button class="btn btn-sm btn-ghost" id="diagBtn">Diagnóstico</button>
        <button class="btn btn-sm btn-ghost" id="reloadBtn">Actualizar</button>
        <button class="btn btn-sm btn-ghost" id="logoutBtn">Salir</button>
      </div>
    </header>

    <main class="admin-main">
      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <label class="field field-inline">
          <span>Buscar</span>
          <input type="search" id="q" placeholder="Nombre, email o teléfono" />
        </label>
        <label class="field field-inline">
          <span>Período</span>
          <select id="range">
            <option value="upcoming">Próximas</option>
            <option value="today">Hoy</option>
            <option value="week">Próximos 7 días</option>
            <option value="past">Pasadas</option>
            <option value="all">Todas</option>
          </select>
        </label>
        <label class="field field-inline">
          <span>Servicio</span>
          <select id="svc"><option value="">Todos</option></select>
        </label>
        <label class="field field-inline">
          <span>Fecha exacta</span>
          <input type="date" id="day" />
        </label>
        <button class="btn btn-sm btn-ghost" id="clearBtn">Limpiar</button>
      </div>

      <div class="table-wrap">
        <table class="table" id="table">
          <thead>
            <tr>
              <th class="sortable" data-sort="date">Fecha / Hora</th>
              <th class="sortable" data-sort="name">Cliente</th>
              <th>Contacto</th>
              <th class="sortable" data-sort="service">Servicio</th>
              <th>Notas</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <p class="empty hidden" id="empty">No hay reservas para este filtro.</p>
      </div>

      <p class="admin-foot" id="footNote"></p>
    </main>
  </div>

  <!-- CONFIRMACIÓN DE CANCELACIÓN -->
  <div class="modal-backdrop hidden" id="modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Cancelar reserva</h3>
      <p class="modal-body" id="modalBody"></p>
      <label class="check">
        <input type="checkbox" id="notify" checked />
        <span>Avisarle al cliente por email</span>
      </label>
      <div class="modal-actions">
        <button class="btn btn-sm btn-ghost" id="modalCancel">Volver</button>
        <button class="btn btn-sm btn-danger" id="modalConfirm">Cancelar reserva</button>
      </div>
    </div>
  </div>

  <!-- DIAGNÓSTICO -->
  <div class="modal-backdrop hidden" id="diagModal">
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="diagTitle">
      <div class="modal-head">
        <h3 id="diagTitle">Diagnóstico de configuración</h3>
        <button class="modal-x" id="diagClose" aria-label="Cerrar">×</button>
      </div>
      <div id="diagBody"><p class="diag-loading">Consultando…</p></div>
      <div class="diag-test">
        <label class="field field-inline">
          <span>Enviar un mail de prueba a</span>
          <input type="email" id="testEmail" placeholder="tu@email.com" />
        </label>
        <button class="btn btn-sm" id="testBtn">Enviar prueba</button>
      </div>
      <p class="form-msg" id="testMsg"></p>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
